name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint et tests (hors ligne)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (embeddings lexicaux + LLM simulé)
        run: pytest -v

      - name: Évaluation de la recherche avec le vrai modèle d'embeddings
        env:
          PYTHONPATH: src
        run: |
          python -m documind.ingest
          python -m documind.evaluate --no-llm
          python -c "
          import json, sys
          r = json.load(open('reports/eval.json'))['retrieval']
          print(r)
          sys.exit(0 if r['hit_at_5'] >= 0.9 else 1)
          "

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t documind .
      - name: Indexation et API dans le conteneur
        run: |
          docker run -d --name documind -p 8000:8000 documind
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 3; done
          curl -sf http://localhost:8000/documents | grep -q politique_conges.pdf
      - if: failure()
        run: docker logs documind
